<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chatbot with Llama</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Elegant and unique color theme -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue background */
            background-image: linear-gradient(to bottom, #f0f4f8, #e2e8f0); /* Subtle gradient */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl overflow-hidden p-6 md:p-8">

        <!-- Header Section -->
        <div class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 tracking-tight">PDF AI Chatbot</h1>
            <p class="mt-2 text-md sm:text-lg text-gray-500">Ask any question, get answers from your PDF.</p>
        </div>

        <!-- File Upload Section -->
        <div id="upload-section" class="bg-gray-50 rounded-2xl p-6 border border-gray-200 shadow-inner">
            <form id="upload-form" enctype="multipart/form-data" class="flex flex-col items-center">
                <label for="pdf-file" class="block w-full py-4 px-6 text-center text-lg font-medium text-indigo-700 bg-indigo-50 rounded-xl cursor-pointer hover:bg-indigo-100 transition-colors duration-200 border-2 border-indigo-200 border-dashed">
                    <span class="block text-2xl mb-2">&#x1F4C4;</span>
                    <span id="upload-text">Select a PDF file</span>
                </label>
                <input type="file" id="pdf-file" name="pdf" accept="application/pdf" class="hidden">
                <button type="submit" id="upload-button" class="mt-4 w-full md:w-auto px-8 py-3 text-white text-lg font-semibold bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-colors duration-200 shadow-md transform hover:scale-105 disabled:bg-gray-400">
                    Process PDF
                </button>
            </form>
            <div id="upload-status" class="mt-4 text-center text-sm font-medium text-gray-700"></div>
            <div id="loading-spinner" class="mt-4 hidden animate-spin rounded-full h-8 w-8 border-4 border-t-4 border-indigo-500 mx-auto"></div>
        </div>

        <!-- Chat Section (initially hidden) -->
        <div id="chat-section" class="hidden mt-6 flex flex-col h-96">
            <!-- Chat display area -->
            <div id="chat-box" class="flex-grow p-4 bg-gray-50 rounded-2xl overflow-y-auto border border-gray-200 shadow-inner space-y-4">
                <div class="flex justify-start">
                    <div class="bg-indigo-100 text-indigo-800 p-4 rounded-xl max-w-[80%] shadow-sm">
                        <p class="font-medium">Hello! I am your PDF AI chatbot. Once you upload a PDF, you can start asking questions.</p>
                    </div>
                </div>
            </div>

            <!-- Message input area -->
            <div class="mt-4 flex items-center">
                <input type="text" id="user-input" class="flex-grow p-4 bg-gray-100 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200 text-lg" placeholder="Type your question here...">
                <button id="send-button" class="ml-2 p-4 text-white bg-indigo-600 hover:bg-indigo-700 rounded-2xl transition-colors duration-200 shadow-md transform hover:scale-105 disabled:bg-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript for client-side logic -->
    <script>
        const uploadForm = document.getElementById('upload-form');
        const pdfFile = document.getElementById('pdf-file');
        const uploadButton = document.getElementById('upload-button');
        const uploadText = document.getElementById('upload-text');
        const uploadStatus = document.getElementById('upload-status');
        const loadingSpinner = document.getElementById('loading-spinner');
        const chatSection = document.getElementById('chat-section');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        pdfFile.addEventListener('change', (event) => {
            if (event.target.files.length > 0) {
                uploadText.textContent = event.target.files[0].name;
            } else {
                uploadText.textContent = 'Select a PDF file';
            }
        });

        uploadForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const file = pdfFile.files[0];

            if (!file) {
                uploadStatus.textContent = 'Please select a PDF file first.';
                uploadStatus.classList.add('text-red-500');
                return;
            }

            const formData = new FormData();
            formData.append('pdf', file);

            uploadButton.disabled = true;
            loadingSpinner.classList.remove('hidden');
            uploadStatus.textContent = 'Uploading and processing PDF...';
            uploadStatus.classList.remove('text-red-500');
            uploadStatus.classList.add('text-gray-700');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();
                uploadButton.disabled = false;
                loadingSpinner.classList.add('hidden');

                if (data.success) {
                    uploadStatus.textContent = data.message;
                    uploadStatus.classList.remove('text-red-500');
                    uploadStatus.classList.add('text-green-500');
                    document.getElementById('upload-section').classList.add('hidden');
                    chatSection.classList.remove('hidden');
                    userInput.focus();
                } else {
                    uploadStatus.textContent = data.message;
                    uploadStatus.classList.remove('text-green-500');
                    uploadStatus.classList.add('text-red-500');
                }

            } catch (error) {
                uploadButton.disabled = false;
                loadingSpinner.classList.add('hidden');
                uploadStatus.textContent = 'Failed to connect to the server.';
                uploadStatus.classList.add('text-red-500');
            }
        });

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            addMessageToChat(message, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            const botMessageContainer = addMessageToChat('', 'bot');
            const botMessageParagraph = botMessageContainer.querySelector('p'); 

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ message: message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullResponse += chunk;
                    botMessageParagraph.textContent = fullResponse;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                
            } catch (error) {
                console.error("Streaming error:", error);
                botMessageParagraph.textContent = 'I apologize, an error occurred while retrieving the answer.';
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function addMessageToChat(message, sender, isLoading = false) {
            const messageContainer = document.createElement('div');
            messageContainer.classList.add('flex', sender === 'user' ? 'justify-end' : 'justify-start');

            const messageBubble = document.createElement('div');
            messageBubble.classList.add('p-4', 'rounded-xl', 'max-w-[80%]', 'shadow-sm');

            if (sender === 'user') {
                messageBubble.classList.add('bg-indigo-500', 'text-white', 'text-lg');
            } else {
                messageBubble.classList.add('bg-gray-200', 'text-gray-800', 'text-lg');
            }

            if (isLoading) {
                messageBubble.classList.add('animate-pulse');
                messageBubble.innerHTML = '<span class="text-2xl font-bold">...</span>';
            } else {
                const p = document.createElement('p');
                p.classList.add('font-medium');
                p.textContent = message;
                messageBubble.appendChild(p);
            }
            
            messageContainer.appendChild(messageBubble);
            chatBox.appendChild(messageContainer);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (isLoading) {
                return messageBubble;
            }
            return messageContainer;
        }
    </script>
</body>
</html>
